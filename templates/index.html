<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Web Calculator</h1>


    <form method="POST" class="calculator-form">
        <input type="text" name="expression" id="expression" placeholder="Type expression or use buttons" value="{{ expression|default('') }}" autocomplete="off" required>

        <div class="button-grid">
            <button type="button" class="digit" onclick="appendValue('7')">7</button>
            <button type="button" class="digit" onclick="appendValue('8')">8</button>
            <button type="button" class="digit" onclick="appendValue('9')">9</button>
            <button type="button" class="action" onclick="deleteChar()">DEL</button>

            <button type="button" class="digit" onclick="appendValue('4')">4</button>
            <button type="button" class="digit" onclick="appendValue('5')">5</button>
            <button type="button" class="digit" onclick="appendValue('6')">6</button>
            <button type="button" class="operator" onclick="appendValue('+')">+</button>

            <button type="button" class="digit" onclick="appendValue('1')">1</button>
            <button type="button" class="digit" onclick="appendValue('2')">2</button>
            <button type="button" class="digit" onclick="appendValue('3')">3</button>
            <button type="button" class="operator" onclick="appendValue('-')">-</button>

            <button type="button" class="digit" onclick="appendValue('0')">0</button>
            <button type="button" class="digit" onclick="appendValue('.')">.</button>
            <button type="button" class="action" onclick="clearExpression()">AC</button>
            <button type="button" class="operator" onclick="appendValue('*')">×</button>

            <button type="button" class="operator" onclick="appendValue('/')">÷</button>
            <button type="button" class="operator" onclick="appendValue('%')">%</button>
            <button type="button" class="operator" onclick="appendValue('**')">^</button>
            <button type="button" class="operator" onclick="appendValue('//')">//</button>
        </div>

        <div class="action-row">
            <button type="submit" class="calculate">=</button>
            <button type="submit" name="clear" value="1" class="clear-btn" formnovalidate>Clear</button>
        </div>
    </form>

    {% if error %}
        <div class="message error">{{ error }}</div>
    {% endif %}

    {% if result is not none %}
        <div class="message result">Result: {{ result }}</div>
    {% endif %}

    <script>
        const expressionInput = document.getElementById('expression');

        function appendValue(value) {
            const cursor = expressionInput.selectionStart;
            const text = expressionInput.value;
            expressionInput.value = text.slice(0, cursor) + value + text.slice(cursor);
            expressionInput.focus();
            expressionInput.selectionStart = expressionInput.selectionEnd = cursor + value.length;
        }

        function deleteChar() {
            const cursor = expressionInput.selectionStart;
            if (cursor === 0) return;
            const text = expressionInput.value;
            expressionInput.value = text.slice(0, cursor - 1) + text.slice(cursor);
            expressionInput.focus();
            expressionInput.selectionStart = expressionInput.selectionEnd = cursor - 1;
        }

        function clearExpression() {
            expressionInput.value = '';
            expressionInput.focus();
        }
    </script>

</body>
</html>
